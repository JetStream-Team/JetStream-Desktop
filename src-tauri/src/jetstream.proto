syntax = "proto3";
package jetstream;

option java_package = "com.jetstream.android.proto";
option java_multiple_files = true;

message MessageWrapper {
    oneof message {
        Notification notification = 1;
        Clipboard clipboard = 2;
    }
}

message Notification {
    bool create = 1;
    int32 id = 2;
    string title = 3;
    string body = 4;
}

message Clipboard {
    string content = 1;
}
