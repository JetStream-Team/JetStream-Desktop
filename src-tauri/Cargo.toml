[package]
name = "jetstream-desktop"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[package.metadata]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "jetstream_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
prost-build = "0.14.3"

[dependencies]
# Tauri dependencies
tauri = { version = "2.9.1", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"

# Discovery dependencies
libmdns = "0.10.1"

# Websocket dependencies
tokio = { version = "1.48.0", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["tokio-rustls"] }
futures-util = "0.3.31"

# TLS dependencies
tokio-rustls = "0.26"
rustls = "0.23.36"
rustls-pemfile = "2.2.0"
rcgen = "0.14.7"

# Protobuf dependencies
prost = "0.14.3"

# Other dependencies
local-ip-address = "0.6.10"
dirs = "6.0.0"
base64 = "0.22.1"
notify-rust = "4.12.0"
clipboard-win = "5.4.1"
env_logger = "0.11.9"
log = "0.4.29"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
lazy_static = "1.5.0"
chrono = "0.4.44"
